name: furnite
description: Pixso furniture shopping app with a complete offline shopping flow.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.11.4
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Muli
      fonts:
        - asset: assets/fonts/Mulish.ttf
          weight: 400
        - asset: assets/fonts/Mulish.ttf
          weight: 600
        - asset: assets/fonts/Mulish.ttf
          weight: 700
